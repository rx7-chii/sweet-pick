# Vercel 自動デプロイ（GitHub Secrets 設定後に有効）
#
# 初回のみ Vercel ダッシュボードでプロジェクト作成後、以下を GitHub Secrets に登録:
#   VERCEL_TOKEN      … https://vercel.com/account/tokens
#   VERCEL_ORG_ID     … vercel project ls または Project Settings → General
#   VERCEL_PROJECT_ID … 同上
#
# ダッシュボードから1回 Deploy するだけなら、この Workflow は不要です。

name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
